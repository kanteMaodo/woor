# Services locaux de développement. Identifiants valables en local uniquement.
# Le regtest Bitcoin et les nœuds LND arrivent en phase 1.
name: woor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: woor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Exécutés une seule fois, au premier démarrage d'une base vide.
      - ../packages/db/migrations:/docker-entrypoint-initdb.d:ro
      # Comptes de connexion locaux, créés après le schéma (ordre alphabétique : « zz »).
      - ./postgres/dev-logins.sql:/docker-entrypoint-initdb.d/zz_dev_logins.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d woor"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
