# Services locaux de développement. Identifiants valables en local uniquement.
# Le regtest Bitcoin et les nœuds LND arrivent en phase 1.
name: woor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: woor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Au premier démarrage d'une base vide, init.sh applique les migrations
      # puis les comptes de connexion locaux (infra/postgres/dev-logins.sql).
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ../packages/db/migrations:/woor/migrations:ro
      - ./postgres/dev-logins.sql:/woor/dev/dev-logins.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d woor"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
